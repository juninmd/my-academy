version: '3.8'
services:
  db-test:
    image: postgres:15
    environment:
      POSTGRES_USER: dummy
      POSTGRES_PASSWORD: dummy
      POSTGRES_DB: dummy_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dummy"]
      interval: 5s
      timeout: 5s
      retries: 5
