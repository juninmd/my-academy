name: my_academy
description: Minha Academia na palma da mão.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^9.0.0
  timezone: ^0.10.1
  rxdart: ^0.28.0
  path_provider: ^2.0.11
  card_swiper : ^3.0.1
  flutter_svg: ^2.0.9
  intl: 0.20.2
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  shared_preferences: ^2.0.20
  table_calendar: ^3.0.0
  json_annotation: ^4.4.0
  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  flutter_hooks: ^0.21.0
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^6.3.0
  dio: ^5.4.0
  go_router: ^17.0.0
  logger: ^2.0.0
  flutter_animate: ^4.5.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  collection: any
  cached_network_image: ^3.3.0
  fl_chart: ^0.63.0
  share_plus: ^12.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.0
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.8
  http: ^1.6.0
  fake_async: ^1.3.3
  benchmark_harness: ^2.2.2

  firebase_auth_platform_interface: any
  google_sign_in_platform_interface: any
dependency_overrides:
  vector_math: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/bg1.jpg
    - assets/images/bg2.jpg
    - assets/images/bg3.jpg
